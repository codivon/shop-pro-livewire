; تسریع پنل و فروشگاه روی هاست‌های PHP-FPM/CGI (cPanel/LiteSpeed).
; این فایل فقط هنگامی اثر دارد که اکستنشن OPcache روی هاست موجود باشد؛
; در غیر این صورت خطوط ناشناخته توسط PHP نادیده گرفته می‌شوند و خطایی رخ نمی‌دهد.
; مبنای چرخهٔ عمر کش: هر ۳۰ ثانیه فایل‌های تغییرکرده دوباره کامپایل می‌شوند
; تا انتشار نسخهٔ جدید بدون دست‌کاری دستی دردسر نداشته باشد.

opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=30
opcache.save_comments=1
